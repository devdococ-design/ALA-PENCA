<section class="section">
  <div class="container">
    <p class="section__eyebrow">{{ t('blog.eyebrow') }}</p>
    <h1 class="section__title">{{ t('blog.title') }}</h1>
    <p class="section__lead">{{ t('blog.lead') }}</p>

    <div class="grid">
      @for (post of posts(); track post.id) {
        <a class="item" [routerLink]="['/tips', post.slug]">
          <img [src]="post.imageUrl" [alt]="title(post)" loading="lazy" />
          <h2>{{ title(post) }}</h2>
          <p>{{ excerpt(post) }}</p>
          <span>{{ t('blog.readMore') }} →</span>
        </a>
      }
    </div>
  </div>
</section>
