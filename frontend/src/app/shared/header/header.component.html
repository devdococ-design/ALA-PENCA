<header class="header" [class.header--open]="menuOpen">
  <div class="header__inner">
    <a routerLink="/" class="logo" (click)="close()">
      <img class="logo__img" src="assets/brand/logo.png" alt="ALA-PENCA" width="48" height="48" />
      <span class="logo__copy">
        <span class="logo__row">
          <span class="logo__mark">ALA</span>
          <span class="logo__text">PENCA</span>
        </span>
        <span class="logo__place">{{ t('nav.location') }}</span>
      </span>
    </a>

    <button class="burger" type="button" (click)="toggle()" [attr.aria-expanded]="menuOpen" aria-label="Menu">
      <span></span><span></span>
    </button>

    <nav class="nav" [class.nav--open]="menuOpen">
      <a routerLink="/" fragment="menu" (click)="close()">{{ t('nav.menu') }}</a>
      <a routerLink="/hospital" routerLinkActive="is-active" (click)="close()">{{ t('nav.hospital') }}</a>
      <a routerLink="/" fragment="nosotros" (click)="close()">{{ t('nav.about') }}</a>
      <a routerLink="/" fragment="galeria" (click)="close()">{{ t('gallery.eyebrow') }}</a>

      <div class="lang">
        <button type="button" [class.is-on]="i18n.lang() === 'es'" (click)="setLang('es')">ES</button>
        <button type="button" [class.is-on]="i18n.lang() === 'en'" (click)="setLang('en')">EN</button>
      </div>
    </nav>
  </div>
</header>
